name: Build and publish CSE472 Lab 02

on:
  push:
    branches: [main]
    paths: ['labs/lab-02-html/source-bundle.b64']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lab-02-main
  cancel-in-progress: false

jobs:
  submission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Restore reviewed Lab 02 source files
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          root = Path('labs/lab-02-html')
          bundle = root / 'source-bundle.b64'
          if bundle.exists():
              raw = lzma.decompress(base64.b64decode(bundle.read_bytes()))
              expected = 'a130ae3dadb0a97b52114ec6134984a944131b848da12eb7ba3c06ad44be4451'
              if hashlib.sha256(raw).hexdigest() != expected:
                  raise SystemExit('Reviewed source bundle checksum mismatch')
              allowed = {'README.md', 'form-demo.js', 'images/event-banner.svg', 'index.html',
                         'package_submission.py', 'report/lab_report_02.tex', 'style.css',
                         'tests/requirements.txt', 'tests/test_site.py', 'tests/write_report_data.py'}
              files = json.loads(raw)
              if set(files) != allowed:
                  raise SystemExit('Unexpected source-bundle member')
              for name, content in files.items():
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(content, encoding='utf-8')
          (root / 'screenshots').mkdir(exist_ok=True)
          PY
      - name: Install test and report tools
        run: |
          python -m pip install -r labs/lab-02-html/tests/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Test the actual served website and capture screenshots
        working-directory: labs/lab-02-html
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/lab02-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          sleep 2
          python tests/test_site.py --base-url http://127.0.0.1:8000/ --chromium "$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/write_report_data.py
      - name: Compile and inspect the LaTeX report
        working-directory: labs/lab-02-html/report
        run: |
          mkdir -p "$RUNNER_TEMP/lab02-tex"
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir="$RUNNER_TEMP/lab02-tex" lab_report_02.tex
          if grep -E 'Overfull|undefined references|LaTeX Error' "$RUNNER_TEMP/lab02-tex/lab_report_02.log"; then
            exit 1
          fi
          cp "$RUNNER_TEMP/lab02-tex/lab_report_02.pdf" lab_report_02.pdf
          pdfinfo lab_report_02.pdf
      - name: Create, list, extract and verify the submission ZIP
        working-directory: labs/lab-02-html
        run: python package_submission.py
      - name: Preserve the complete submission as a downloadable artifact
        uses: actions/upload-artifact@v7
        with:
          name: CSE472-Lab-02-Complete
          path: |
            labs/lab-02-html/CSE472_Lab_02_Complete.zip
            labs/lab-02-html/report/lab_report_02.pdf
          if-no-files-found: error
          retention-days: 7
      - name: Commit only Lab 02 files and publish without force
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          bundle = Path('labs/lab-02-html/source-bundle.b64')
          if bundle.exists():
              bundle.unlink()
          PY
          git status --short
          git add -- labs/lab-02-html
          git diff --cached --check
          git diff --cached --stat
          python - <<'PY'
          import subprocess
          names = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          if any(not n.startswith('labs/lab-02-html/') for n in names):
              raise SystemExit('Refusing to stage an unrelated path')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Complete CSE472 Lab 02 HTML website and LaTeX report'
            git push origin HEAD:main
          fi
          git rev-parse HEAD
          git ls-remote origin refs/heads/main
