name: Build and publish CSE472 Lab 02

on:
  push:
    branches: [main]
    paths: ['labs/lab-02-html/build_submission.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lab-02-main
  cancel-in-progress: false

jobs:
  submission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install browser, validation and report tools
        run: |
          python -m pip install playwright==1.57.0 beautifulsoup4==4.14.3 tinycss2==1.5.1
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Build, test, compile and verify Lab 02
        working-directory: labs/lab-02-html
        run: python -u build_submission.py
      - name: Preserve submission and test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CSE472-Lab-02-Complete
          path: |
            labs/lab-02-html/CSE472_Lab_02_Complete.zip
            labs/lab-02-html/report/lab_report_02.pdf
            labs/lab-02-html/tests/results.json
            labs/lab-02-html/tests/build-status.json
          if-no-files-found: warn
          retention-days: 7
      - name: Review and publish only Lab 02 files
        shell: bash
        run: |
          git status --short
          git add -- labs/lab-02-html
          git diff --cached --check
          git diff --cached --stat
          python - <<'PY'
          import subprocess
          names = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          if any(not n.startswith('labs/lab-02-html/') for n in names):
              raise SystemExit('Refusing to stage an unrelated path')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Complete CSE472 Lab 02 HTML website and LaTeX report'
            git push origin HEAD:main
          fi
          git rev-parse HEAD
          git ls-remote origin refs/heads/main
